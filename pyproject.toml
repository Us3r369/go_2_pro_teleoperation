[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-control"
version = "0.1.0"
description = "Standalone control and video-streaming scripts for the Unitree Go2, built on the go2_webrtc_driver."
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "opencv-python",
    "numpy",
]

# NOTE: the Go2 WebRTC driver is consumed as a separate editable install, not a
# PyPI dependency. Install it once into the same environment:
#     pip install -e ../go2_webrtc_connect

# This project is just a folder of runnable scripts (no importable package).
[tool.setuptools]
py-modules = []
