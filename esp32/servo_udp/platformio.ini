; Seeed Studio XIAO ESP32-S3 — WiFi UDP servo receiver
; Servo signal on silk-screen pin D10 (= GPIO9), powered from 5V / GND.
;
; Receives a target angle (ASCII degrees) over UDP from the laptop bridge
; (scripts/servo_bridge.py) and drives a 1-DOF pan servo to it, with slew
; limiting and a stale-input watchdog. Broadcasts a discovery beacon so the
; laptop learns this board's IP without any hardcoded address.
;
; WiFi credentials live in src/secrets.h (gitignored). Copy src/secrets.h.example
; to src/secrets.h and fill it in before building.

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; ESP32Servo handles the LEDC PWM generation for hobby servos on the ESP32-S3.
lib_deps = madhephaestus/ESP32Servo @ ^3.0.5
