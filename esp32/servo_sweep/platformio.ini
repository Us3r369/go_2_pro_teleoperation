; Seeed Studio XIAO ESP32-S3 — servo sweep demo
; Servo signal on silk-screen pin D10 (= GPIO9), powered from 5V / GND.

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; ESP32Servo handles the LEDC PWM generation for hobby servos on the ESP32-S3.
lib_deps = madhephaestus/ESP32Servo @ ^3.0.5
